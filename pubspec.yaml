name: bus_driver
description: Bus driver app - phone GPS, BLE link to the ESP32 RFID unit, offline queue, boarding/alighting switch.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.4
  flutter_blue_plus: ^1.34.5
  sqflite: ^2.3.3+1
  path: ^1.9.0
  http: ^1.2.2
  intl: ^0.19.0

flutter:
  uses-material-design: true
